spring.application.name=payments
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/payments
spring.datasource.username=user
spring.datasource.password=userpass
spring.jpa.hibernate.ddl-auto=update

jwt.config.base-64-secret=${JWT_CONFIG_BASE_64_SECRET:cbIFcxdq6D+KfLjHXitkoqbbOSNNCl5Lw7AMiGm+lDY=}
jwt.config.expiry-ms=3600000

api.config.services.PAYMENT_SERVICE_PROVIDER.base-url=http://localhost:8085
api.config.services.PAYMENT_SERVICE_PROVIDER.clients.CREATE_CHECKOUT_SESSION.api-path=/v1/checkout/sessions
api.config.services.PAYMENT_SERVICE_PROVIDER.clients.CREATE_CHECKOUT_SESSION.connect-timeout-ms=1000
api.config.services.PAYMENT_SERVICE_PROVIDER.clients.CREATE_CHECKOUT_SESSION.read-timeout-ms=2000

payments.webhook.secret=whsec_local_dev_secret
payments.webhook.tolerance-seconds=300

resilience4j.retry.instances.createCheckoutSessionProvider.max-attempts=3
resilience4j.retry.instances.createCheckoutSessionProvider.wait-duration=500ms
resilience4j.retry.instances.createCheckoutSessionProvider.enable-exponential-backoff=true
resilience4j.retry.instances.createCheckoutSessionProvider.exponential-backoff-multiplier=2
resilience4j.retry.instances.createCheckoutSessionProvider.randomized-wait-factor=0.5
resilience4j.retry.instances.createCheckoutSessionProvider.retry-exceptions[0]=java.io.IOException
resilience4j.retry.instances.createCheckoutSessionProvider.retry-exceptions[1]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.createCheckoutSessionProvider.retry-exceptions[2]=org.ngs.payments.exception.external.ExternalApiServerException
resilience4j.retry.instances.createCheckoutSessionProvider.retry-exceptions[3]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.createCheckoutSessionProvider.ignore-exceptions[0]=org.ngs.payments.exception.external.ExternalApiClientException
resilience4j.retry.instances.createCheckoutSessionProvider.ignore-exceptions[1]=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.register-health-indicator=true
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.record-exceptions[0]=java.io.IOException
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.record-exceptions[1]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.record-exceptions[2]=org.ngs.payments.exception.external.ExternalApiServerException
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.record-exceptions[3]=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.createCheckoutSessionProvider.ignore-exceptions[0]=org.ngs.payments.exception.external.ExternalApiClientException