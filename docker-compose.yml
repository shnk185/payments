services:
  mysql:
    image: mysql:8.0
    container_name: mysql-payments
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: payments
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-payments-data:/var/lib/mysql

volumes:
  mysql-payments-data: